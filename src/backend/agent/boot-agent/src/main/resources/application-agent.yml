spring:
  application:
    name: agent
server:
  port: 25915

# 本地开发时可在此覆盖；生产环境通常由配置中心注入 model 与限流
agent:
  local-tools-enabled: true
  compaction:
    enabled: true
    flush-before-compact: false
    offload-before-compact: false
  tool-result-eviction:
    enabled: true
  model:
    base-url:
    api-key:
    model-name:

rate:
  limiter:
    enabled: false
    rules:
      - algo: TOKEN_BUCKET
        resource: "*:/api/agent/run"
        limitDimension: USER_URL
        limit: 10
        duration: 60s
        capacity: 20
        scope: GLOBAL
